<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A modern and responsive To-Do List application built with HTML, CSS and JavaScript."
    >

    <title>To-Do List | JavaScript</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <main class="app">

        <!-- Header -->
        <header class="app-header">

            <div class="title-wrapper">

                <div class="title-icon">
                    ✓
                </div>

                <div>
                    <p class="eyebrow">
                        PRODUCTIVITY
                    </p>

                    <h1>
                        My Tasks
                    </h1>
                </div>

            </div>

            <p class="subtitle">
                Organize your day, one task at a time.
            </p>

        </header>


        <!-- Add Task -->
        <section class="task-input">

            <input
                type="text"
                id="value"
                placeholder="What needs to be done?"
                maxlength="100"
                autocomplete="off"
            >

            <button
                type="button"
                id="btn"
            >
                <span>+</span>
                Add Task
            </button>

        </section>


        <!-- Stats -->
        <section class="stats">

            <div class="stat-card">

                <span class="stat-label">
                    TOTAL
                </span>

                <span
                    id="totalTasks"
                    class="stat-value"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    ACTIVE
                </span>

                <span
                    id="activeTasks"
                    class="stat-value active"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    DONE
                </span>

                <span
                    id="completedTasks"
                    class="stat-value completed"
                >
                    0
                </span>

            </div>

        </section>


        <!-- Toolbar -->
        <section class="toolbar">

            <div class="search-wrapper">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    type="text"
                    id="searchTask"
                    placeholder="Search tasks..."
                    autocomplete="off"
                >

            </div>


            <button
                type="button"
                id="clearCompleted"
                class="clear-btn"
            >
                Clear completed
            </button>

        </section>


        <!-- Task List -->
        <section class="tasks-section">

            <ul id="task-container"></ul>


            <div
                id="emptyState"
                class="empty-state"
            >

                <div class="empty-icon">
                    ✓
                </div>

                <h2>
                    No tasks yet
                </h2>

                <p>
                    Add your first task and start getting things done.
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
